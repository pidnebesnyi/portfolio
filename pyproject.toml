[project]
name = "payments-qa-lab"
version = "0.1.0"
description = "QA automation portfolio: test framework, CI pipeline and reporting around a mock payments service."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "T20"]
ignore = [
    "S101",  # assert is the point of a test suite
    "S105",  # lab credentials are fake and documented
    "S106",
    "S107",
    "RUF012",  # pydantic / sqlalchemy class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311", "S608"]  # random for unique data; SQL strings are test-owned constants

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "provider-mock"]
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["allure.*", "allure_commons.*", "schemathesis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# allure's decorator helpers ship without type hints; the wrapper in this module re-types them.
module = ["tests.utils.allure_links", "tests.utils.allure_evidence", "tests.conftest"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers: a typo in a marker must fail collection, not silently select nothing.
# Retries are never global: only tests carrying @pytest.mark.flaky(reruns=N) are rerun.
# Playwright (UI tests only): keep trace and video of failed tests, screenshot on failure.
addopts = """--strict-markers --strict-config -ra --alluredir=allure-results
  --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure
  --output=test-results"""
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "smoke: critical-path checks, run first on every PR (target < 1 min)",
    "regression: full functional coverage, run on every PR",
    "quarantine: known-unstable test, excluded from every gate until fixed (needs an issue link)",
    "flaky(reruns=N): the only way a test is retried; each use needs a written reason",
    "area(name): product area, shown as the Allure feature",
    "requirement(id): requirement id the test covers (Allure label + link)",
    "seeded_bug(id): test is expected to fail when the named bug is injected into the app",
    "ui: browser test (Playwright)",
    "sensitive: test types credentials into the browser; its trace and video are never kept",
    "db: test reads the database directly to verify state",
    "contract: schema-driven checks against /openapi.json",
    "integration: needs the provider mock to behave in a specific way",
]
