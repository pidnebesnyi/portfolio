# pip updates weekly and groups minor/patch bumps to keep the test stack current with fewer PRs.
# GitHub Actions updates monthly since workflow action pins change rarely and need less churn.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # playwright must match the browsers baked into tests/Dockerfile's image tag,
    # so it and pytest-playwright are bumped by hand together with that tag.
    ignore:
      - dependency-name: "playwright"
      - dependency-name: "pytest-playwright"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/load"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
