# Nightly regression + published Allure report. Triggers: 02:30 UTC every day, and manual runs
# (workflow_dispatch) that narrow the run with the path, markers and workers inputs.
# Order: `tests` runs the selected tests (by default the whole suite: api, db, ui, bdd) on one
# compose stack, in parallel with pytest-xdist; then `report` restores the trend history from the
# gh-pages branch, adds it to the run's allure-results and builds the Allure report, which is
# always uploaded as an artifact. Only scheduled runs and manual runs with `publish` set go on:
# they publish gh-pages:/report/, run scripts/build_site.py, which writes the report's numbers
# into the landing page, and publish ONLY site-build/ (index.html, style.css, cv.pdf if present)
# to the gh-pages ROOT. A manual run without `publish` leaves gh-pages untouched.
# Every publish here uses keep_files: true, so it adds or overwrites just the files it ships and
# cannot remove /report/ or /load/ (the load workflow owns the latter).
# Nothing here needs repository secrets: the tests job generates throwaway credentials. Not a
# merge gate; a red night shows in the report.
name: Nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      path:
        description: "Test path(s) or node ids, space-separated (letters, digits, / _ . - :)"
        type: string
        default: "tests"
      markers:
        description: "pytest -m expression, e.g. smoke or 'api and not slow' (empty = no filter)"
        type: string
        default: ""
      workers:
        description: "pytest-xdist workers: auto or a positive integer"
        type: string
        default: "auto"
      publish:
        description: "Publish the report and landing page to gh-pages (scheduled runs always do)"
        type: boolean
        default: false

# Two report publishers must not race on gh-pages; a queued run waits instead of cancelling.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway credentials
        run: |
          set -euo pipefail
          scripts/make_env.sh
          while IFS='=' read -r key value; do
            [ "$key" = "ADMIN_EMAIL" ] || echo "::add-mask::$value"
          done < .env
      - name: Start the stack (db, app, provider-mock, rabbitmq)
        run: docker compose up --build --wait db app provider-mock rabbitmq
      - name: Run the suite
        # GITHUB_SHA / GITHUB_RUN_ID / REPO_URL reach the container through docker-compose.yml;
        # REPO_URL turns requirement ids into links to their GitHub issues in the report.
        # Scheduled runs have no inputs, so the fallbacks give the full suite on auto workers.
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TEST_PATH: ${{ inputs.path || 'tests' }}
          MARKERS: ${{ inputs.markers || '' }}
          WORKERS: ${{ inputs.workers || 'auto' }}
        run: |
          set -euo pipefail
          workers_re='^(auto|[1-9][0-9]*)$'
          if [[ ! "$WORKERS" =~ $workers_re ]]; then
            echo "::error::workers must be 'auto' or a positive integer, got '$WORKERS'"
            exit 1
          fi
          # Paths or node ids separated by single spaces; no leading dash, so no pytest options.
          path_re='^[A-Za-z0-9_./:][A-Za-z0-9_./:-]*( [A-Za-z0-9_./:][A-Za-z0-9_./:-]*)*$'
          if [[ ! "$TEST_PATH" =~ $path_re ]]; then
            echo "::error::path may only hold letters, digits, / _ . - : and spaces between paths"
            exit 1
          fi
          read -r -a paths <<< "$TEST_PATH"
          args=(pytest -n "$WORKERS" "${paths[@]}")
          if [ -n "$MARKERS" ]; then
            args+=(-m "$MARKERS")
          fi
          docker compose run --rm tests "${args[@]}"
      - name: App logs (on failure)
        if: failure()
        run: docker compose logs --no-color app provider-mock db
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright traces, videos and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  report:
    needs: tests
    if: ${{ !cancelled() }} # publish even when a test failed: the report is the point
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gh-pages # one writer at a time across workflows; a parallel push is rejected
      cancel-in-progress: false
    permissions:
      contents: write # peaceiris pushes to the gh-pages branch; this is the only job that may
    env:
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report/
    steps:
      - uses: actions/checkout@v7 # the landing template and scripts/build_site.py
      - name: Download the run's results
        continue-on-error: true # no artifact when the stack never came up; the report then shows no data
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - name: Fetch Allure history from gh-pages
        uses: actions/checkout@v7
        continue-on-error: true # the very first run has no gh-pages branch yet
        with:
          ref: gh-pages
          path: gh-pages
      - name: Restore history and describe this build
        run: |
          set -euo pipefail
          mkdir -p allure-results # missing when the download above found no artifact
          if [ -d gh-pages/report/history ]; then
            cp -r gh-pages/report/history allure-results/history
          fi
          cat > allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Nightly #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${REPORT_URL}"
          }
          JSON
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build the Allure report
        # Java 17 is preinstalled on ubuntu-latest, which is all the Allure CLI needs.
        run: |
          npm install --global allure-commandline@2.32.0
          allure generate allure-results --clean --output allure-report
      - name: Build the landing page from the report's summary
        # Standard library only. A missing summary.json shows "-" instead of failing the job.
        run: python3 scripts/build_site.py --summary allure-report/widgets/summary.json --out-dir site-build
      - name: Upload the report as an artifact (also when publishing fails)
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
      - name: Publish to gh-pages /report/
        if: github.event_name == 'schedule' || inputs.publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # the built-in per-run token, not a stored secret
          publish_dir: allure-report
          destination_dir: report
          keep_files: true # other workflows publish /load/; never wipe the branch
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "docs(report): nightly #${{ github.run_number }}"
      - name: Publish the landing page to the gh-pages root
        if: github.event_name == 'schedule' || inputs.publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site-build # only the landing files, never the whole branch
          # destination_dir is left empty on purpose: the root of the branch.
          keep_files: true # without it the root publish would delete report/ and load/
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "docs(site): landing page, nightly #${{ github.run_number }}"
