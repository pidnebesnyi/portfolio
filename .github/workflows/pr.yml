# PR gate. Trigger: every pull request (and manual runs).
# Order: `lint` (ruff; seconds, no containers), `api` (compose stack, then
# unit, API, contract, integration, DB, log and event tests, then the Postman collection) and `ui-smoke` (own compose stack, smoke-tagged browser
# tests) run in parallel; a failure in any of them blocks the merge, so make all three required
# checks in branch protection. Nothing here needs repository secrets: each job generates
# throwaway credentials for each run.
name: PR

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR makes the previous run obsolete.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway credentials
        run: |
          set -euo pipefail
          scripts/make_env.sh
          # Mask every generated value in logs (the admin email is not a secret).
          while IFS='=' read -r key value; do
            [ "$key" = "ADMIN_EMAIL" ] || echo "::add-mask::$value"
          done < .env
      - name: Start the stack (db, app, provider-mock, rabbitmq)
        run: docker compose up --build --wait db app provider-mock rabbitmq
      - name: Unit, API, contract, integration, DB, log and event tests
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: docker compose run --rm tests pytest -n auto tests/unit tests/api tests/contract tests/integration tests/db tests/logs tests/events
      - name: Postman collection (Newman)
        # Runs even when pytest failed, so one red step does not hide the other's result.
        if: ${{ !cancelled() }}
        run: docker compose --profile postman run --rm newman
      - name: App logs (on failure)
        if: failure()
        run: docker compose logs --no-color app provider-mock db
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway credentials
        run: |
          set -euo pipefail
          scripts/make_env.sh
          while IFS='=' read -r key value; do
            [ "$key" = "ADMIN_EMAIL" ] || echo "::add-mask::$value"
          done < .env
      - name: Start the stack (db, app, provider-mock; rabbitmq comes up as a dependency)
        run: docker compose up --build --wait db app provider-mock
      - name: Browser smoke tests
        # 6 smoke tests; two workers is enough and leaves CPU for the app on a 2-core runner.
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: docker compose run --rm tests pytest -m "smoke and ui" -n 2
      - name: App logs (on failure)
        if: failure()
        run: docker compose logs --no-color app provider-mock db
      - name: Upload Playwright traces, videos and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-smoke
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-smoke
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --volumes
