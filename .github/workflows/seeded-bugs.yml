# Does the test suite still catch known defects? Trigger: weekly (Monday 05:00 UTC) and manual.
# Order: `run` starts the compose stack once per matrix entry, with one seeded bug switched on
# (`none` = correct app, the baseline), and runs the api + integration suites. For a bug entry the
# pytest step is EXPECTED to fail (continue-on-error); its JUnit XML is uploaded either way.
# `report` then reads all XML files: a bug counts as caught when a test marked for it failed, the
# baseline must be green. It fails the workflow if a bug escaped and publishes site/bugs/ to the
# gh-pages branch under /bugs (keep_files: other workflows own /report/ and /load/).
# Evidence: every run also uploads its Allure results. `report` merges the four BUG runs (not the
# green baseline) into ONE Allure report and publishes it to /bugs/report/, so a visitor can open a
# caught failure and see steps, last request/response and SQL. The tests label each result with the
# bug that was on (SEEDED_BUGS reaches the tests container: Allure parent suite + parameter, see
# seeded_run() in tests/utils/allure_links.py); the parameter keeps the runs from collapsing into
# one, because Allure treats results with the same name and parameters as retries of one test.
# Nothing here needs repository secrets: credentials are generated per run and masked.
name: Seeded bugs

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: seeded-bugs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    name: run (${{ matrix.bug }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # a bug that escapes must not hide the results of the other runs
      matrix:
        bug: [none, BUG-1, BUG-2, BUG-3, BUG-4]
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway credentials
        run: |
          set -euo pipefail
          scripts/make_env.sh
          # Mask every generated value in logs (the admin email is not a secret).
          while IFS='=' read -r key value; do
            [ "$key" = "ADMIN_EMAIL" ] || echo "::add-mask::$value"
          done < .env
      - name: Select the seeded bug
        env:
          BUG: ${{ matrix.bug }}
        run: |
          # compose passes SEEDED_BUGS to the app; empty means a correct app.
          if [ "$BUG" = none ]; then
            echo "SEEDED_BUGS=" >> "$GITHUB_ENV"
          else
            echo "SEEDED_BUGS=$BUG" >> "$GITHUB_ENV"
          fi
      - name: Start the stack (db, app, provider-mock)
        run: docker compose up --build --wait db app provider-mock
      - name: Check the app runs the intended variant
        env:
          BUG: ${{ matrix.bug }}
        run: |
          # Guards the guard: a mistyped switch would run a correct app and look like an escape.
          logs="$(docker compose logs --no-color app)"
          if [ "$BUG" = none ]; then
            if grep -q "SEEDED BUGS ENABLED" <<< "$logs"; then echo "baseline has a bug on" >&2; exit 1; fi
          else
            grep -q "SEEDED BUGS ENABLED: $BUG\." <<< "$logs" || { echo "$BUG not enabled" >&2; exit 1; }
          fi
      - name: API and integration tests (expected to fail when a bug is on)
        id: tests
        continue-on-error: true
        env:
          BUG: ${{ matrix.bug }}
        run: |
          mkdir -p junit
          docker compose run --rm tests pytest -m "not quarantine" -n auto \
            tests/api tests/integration --junitxml="junit/${BUG}.xml"
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.bug }}
          path: junit/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.bug }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  report:
    needs: run
    if: always() # a missing run must show up as "no data" in the report, not skip it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job pushes to gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true
          path: junit
      - name: Download the bug runs' Allure results
        # allure-results-BUG-* skips the baseline: it is green by definition (the page above
        # reports it), and its passing tests would only bury the failures this report is for.
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-BUG-*
          merge-multiple: true
          path: allure-results
      - name: Build the seeded-bugs report
        id: report
        continue-on-error: true # publish the page first, fail the job afterwards
        run: python scripts/seeded_bugs_report.py --junit-dir junit
      - name: Publish to gh-pages (/bugs)
        if: hashFiles('site/bugs/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/bugs
          destination_dir: bugs
          keep_files: true # adds to bugs/, never removes bugs/report/ (published below)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the Allure report of the runs with a bug on
        id: allure
        # Java 17 is preinstalled on ubuntu-latest, which is all the Allure CLI needs. The runs'
        # environment.properties differ only in Seeded.Bugs and the last one downloaded would win,
        # so list the bugs that really have results. Parameter values are quoted by allure-pytest.
        if: hashFiles('allure-results/*-result.json') != ''
        run: |
          set -euo pipefail
          bugs="$(jq -r --arg q "'" \
            '.parameters[]? | select(.name == "seeded bugs") | .value | gsub($q; "")' \
            allure-results/*-result.json | sort -u | paste -sd, -)"
          sed -i "s/^Seeded.Bugs=.*/Seeded.Bugs=${bugs} (one run each)/" allure-results/environment.properties
          npm install --global allure-commandline@2.32.0
          allure generate allure-results --clean --output allure-report
      - name: Publish to gh-pages (/bugs/report)
        if: steps.allure.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: bugs/report
          keep_files: true # the /bugs/ page and the other workflows' folders stay
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "docs(bugs): allure report of the seeded-bug runs #${{ github.run_number }}"
      - name: Upload bugs.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugs-report
          path: bugs.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail if a bug escaped
        if: steps.report.outcome == 'failure'
        run: |
          echo "A seeded bug escaped the test suite or the baseline run is red; see the report step." >&2
          exit 1
