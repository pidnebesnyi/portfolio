{% extends "base.html" %}
{% block title %}Verification code{% endblock %}
{% block content %}
<h1>Verification code</h1>
<form method="post" action="/ui/2fa" data-testid="2fa-form">
  <label>Code <input name="code" required inputmode="numeric" autocomplete="one-time-code" data-testid="2fa-code"></label>
  <button type="submit" data-testid="2fa-submit">Verify</button>
</form>
{% endblock %}
