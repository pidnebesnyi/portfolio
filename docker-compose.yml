# Whole stack for local runs and CI:  docker compose up --wait db app provider-mock
# Run the suite:                      docker compose run --rm tests
# First run `scripts/make_env.sh`: every credential comes from .env, none is stored in the repo.
# Compose refuses to start when a required variable is missing.

x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (scripts/make_env.sh)}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lab.test}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
  ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?set ADMIN_TOTP_SECRET in .env}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: payments
    volumes:
      # Scripts run once, in name order, when the data directory is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  provider-mock:
    build: ./provider-mock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "8081:8081"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      <<: *secrets
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/payments
      PROVIDER_URL: http://provider-mock:8081
      PROVIDER_TIMEOUT_S: "2"
      SEEDED_BUGS: ${SEEDED_BUGS:-}
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      <<: *secrets
      BASE_URL: http://app:8000
      DB_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/payments
      PROVIDER_URL: http://provider-mock:8081
      # Shown in the Allure Environment widget; empty outside CI.
      GITHUB_SHA: ${GITHUB_SHA:-}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-}
    # Chromium shares memory through /dev/shm; the Playwright image docs recommend this.
    ipc: host
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./allure-results:/work/allure-results
      - ./junit:/work/junit
      # Playwright traces, videos and screenshots of failed UI tests.
      - ./test-results:/work/test-results
    # Default command comes from the image: pytest -m "not quarantine" -n auto

  locust:
    image: locustio/locust:2.32.5
    profiles: [load]
    # load/locustfile.py is added in phase 4.
    command: -f /mnt/locust/locustfile.py --host http://app:8000 --headless -u 20 -r 5 -t 1m
    volumes:
      - ./load:/mnt/locust:ro
    depends_on:
      app:
        condition: service_healthy
