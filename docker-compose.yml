# Whole stack for local runs and CI:  docker compose up --wait db app provider-mock
# Run the suite:                      docker compose run --rm tests
# First run `scripts/make_env.sh`: every credential comes from .env, none is stored in the repo.
# Compose refuses to start when a required variable is missing.

x-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (scripts/make_env.sh)}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lab.test}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
  ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?set ADMIN_TOTP_SECRET in .env}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: payments
    volumes:
      # Scripts run once, in name order, when the data directory is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # management UI

  provider-mock:
    # WireMock; the stubs are the JSON files in provider-mock/mappings (one per card token).
    image: wiremock/wiremock:3.13.2-3
    # Journal capped so a long load run cannot grow the container's memory without limit.
    command: ["--max-request-journal-entries", "10000", "--disable-banner"]
    volumes:
      - ./provider-mock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # WireMock listens on 8080 inside the network; 8081 on the host stays the PROVIDER_URL default.
      - "127.0.0.1:8081:8080"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      <<: *secrets
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/payments
      PROVIDER_URL: http://provider-mock:8080
      PROVIDER_TIMEOUT_S: "2"
      # JSON request log: stdout (docker compose logs app) and this file, which the tests read.
      LOG_FILE: /var/log/app/app.log
      RABBITMQ_URL: amqp://lab:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
    volumes:
      - app-logs:/var/log/app
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      <<: *secrets
      BASE_URL: http://app:8000
      DB_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/payments
      PROVIDER_URL: http://provider-mock:8080
      # The app's log file (read-only mount of the app's volume) and the broker it publishes to.
      APP_LOG_FILE: /work/app-logs/app.log
      RABBITMQ_URL: amqp://lab:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      # Shown in the Allure Environment widget; empty outside CI.
      GITHUB_SHA: ${GITHUB_SHA:-}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-}
    # Chromium shares memory through /dev/shm; the Playwright image docs recommend this.
    ipc: host
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./allure-results:/work/allure-results
      - ./junit:/work/junit
      # Playwright traces, videos and screenshots of failed UI tests.
      - ./test-results:/work/test-results
      - app-logs:/work/app-logs:ro
    # Default command comes from the image: pytest -n auto

  locust:
    # Same version as load/requirements.txt. Start with: docker compose --profile load run --rm locust
    image: locustio/locust:2.46.7
    profiles: [load]
    environment:
      # The stock image has no pyotp; the locustfile computes the admin TOTP code itself.
      <<: *secrets
    # thresholds.py judges the run (p95, error rate), so Locust's own "exit 1 on any error" is off.
    command: >
      -f /mnt/locust/locustfile.py,/mnt/locust/thresholds.py
      --host http://app:8000 --headless -u 20 -r 5 -t 1m --exit-code-on-error 0
      --html /mnt/report/report.html --csv /mnt/report/stats
    volumes:
      - ./load:/mnt/locust:ro
      # The report lands here. The container user is not the host user: make the directory
      # writable first (CI does `mkdir -m 777 load-report`).
      - ./load-report:/mnt/report
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-logs:
